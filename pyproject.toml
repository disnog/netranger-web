[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netranger-web"
version = "2.0.0"
description = "Web portal for Network Ranger Discord server"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Jason R. Rokeach" }
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "itsdangerous>=2.1.0",
    "netranger-db @ git+https://github.com/disnog/netranger-db.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
nrweb = "nrweb.main:main"

[tool.hatch.build.targets.wheel]
packages = ["nrweb"]
