[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netranger-web"
version = "2.0.0"
description = "Web portal for Network Ranger Discord server"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Jason R. Rokeach" }
]
dependencies = [
    "Flask>=3.0.0",
    "gunicorn>=21.0.0",
    "httpx>=0.26.0",
    "itsdangerous>=2.1.0",
    "netranger-db @ git+https://github.com/disnog/netranger-db.git@v2dev",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-flask>=1.3.0",
    "pytest-cov>=5.0",
    "ruff>=0.1.0",
]

[project.scripts]
nrweb = "nrweb.main:main"

[tool.hatch.build.targets.wheel]
packages = ["nrweb"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
